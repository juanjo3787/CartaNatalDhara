services:
  app:
    container_name: cartaNatal-app
    image: carta-natal-dhara:latest
    build:
      context: ${PROJECT_PATH:-/volume1/docker/CartaNatalDhara}/app
      dockerfile: Dockerfile
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - ${DEPLOY_PATH:-/volume1/docker/configCNDhara}/storage:/var/www/html/storage
      - ${DEPLOY_PATH:-/volume1/docker/configCNDhara}/bootstrap-cache:/var/www/html/bootstrap/cache
    env_file:
      - ${COMPOSE_ENV_FILE:-./.env}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://cartanataldhara.synology.me}
      ASTROLOGY_EPHEMERIS_PATH: /opt/ephemeris
      ASTROLOGY_SWETEST_BIN: /usr/local/bin/swetest
    restart: unless-stopped